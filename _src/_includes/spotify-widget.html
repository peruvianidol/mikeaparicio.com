<!-- _includes/spotify-widget.html -->

<section data-grid-area="listening">
  <h2 class="ma-eyebrow-sm ma-stack ma-flex" style="--flex-gap: 4px; --flex-align: start">
    {% icon "music", "ma-icon" %}
    <span>Listening</span>
  </h2>
  <ul id="sw-list" class="ma-grid" role="list" style="--grid-col-min: 220px"></ul>
</section>

<script>
(function () {
  const list = document.getElementById('sw-list');

  function renderTrack(track) {
    const li = document.createElement('li');
    li.className = "ma-flex";
    li.innerHTML = `
      <img src="${track.imageUrl}" alt="${track.name} album art" loading="lazy" width="48" height="48">
      <div>
        <p class="ma-text-sm"><a href="${track.url}" target="_blank" rel="noopener">${track.name}</a></p>
        <p class="ma-text-subdued ma-text-xs">${track.artist}</p>
      </div>`;

    return li;
  }

  function renderError(msg) {
    const li = document.createElement('li');
    li.innerHTML = `${msg}`;
    return li;
  }

  fetch('/api/spotify-status')
    .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then(({ tracks }) => {
      list.innerHTML = '';

      if (!tracks.length) {
        list.appendChild(renderError('No tracks found.'));
        return;
      }

      tracks.forEach((t) => list.appendChild(renderTrack(t)));
    })
    .catch((err) => {
      list.innerHTML = '';
      list.appendChild(renderError('Could not load playlist.'));
      console.error('[spotify-widget]', err);
    });
}());
</script>
