<!-- _includes/insta-idol-widget.html -->

<section data-grid-area="snapping">
  <h2 class="ma-eyebrow-sm ma-stack ma-flex" style="--flex-gap: 4px; --flex-align: start">
    {% icon "camera", "ma-icon" %}
    <span>Snapping</span>
  </h2>
  <div id="ii-content"></div>
</section>

<script>
(function () {
  const container = document.getElementById('ii-content');

  function formatDate(iso) {
    return new Date(iso).toLocaleDateString('en-US', {
      month: 'short', day: 'numeric', year: 'numeric'
    });
  }

  const mq = window.matchMedia('(width > 700px)');
  const widgets = document.querySelector('.ma-layout-widgets');

  // Deferred to DOMContentLoaded: this script runs before the later
  // watching/playing/listening widgets (included further down the page)
  // have been parsed, so querying for them here would return null.
  function setupPostingHeightSync() {
    const snapping = document.querySelector('[data-grid-area="snapping"]');
    const watching = document.querySelector('[data-grid-area="watching"]');
    const playing = document.querySelector('[data-grid-area="playing"]');
    const listening = document.querySelector('[data-grid-area="listening"]');

    function syncPostingHeight() {
      if (!mq.matches || !widgets) return;
      const gap = parseFloat(getComputedStyle(widgets).rowGap) || 0;
      const rowTwoHeight = Math.max(watching?.offsetHeight ?? 0, playing?.offsetHeight ?? 0);
      const total = (snapping?.offsetHeight ?? 0) + rowTwoHeight + (listening?.offsetHeight ?? 0) + gap * 2;
      widgets.style.setProperty('--posting-max-height', `${total}px`);
    }

    [snapping, watching, playing, listening].forEach((el) => {
      if (el) new ResizeObserver(syncPostingHeight).observe(el);
    });
    mq.addEventListener('change', syncPostingHeight);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupPostingHeightSync);
  } else {
    setupPostingHeightSync();
  }

  fetch('/api/insta-idol-status')
    .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then(({ photo }) => {
      container.innerHTML = `
        <figure class="ma-stack">
          <div class="ma-photo">
            <a href="${photo.url}" target="_blank" rel="noopener">
              <img src="${photo.thumbnail}" alt="${photo.title}" fetchpriority="high">
            </a>
          </div>
          <figcaption class="ma-text-sm ma-surface ma-inset-square-8">
            <p>${photo.title}</p>
            <div class="ma-space-between">
              <span class="ma-text-subdued">${formatDate(photo.date)}</span>
              <div class="ma-text-xs ma-text-subdued">
                <a href="https://insta-idol.mikeaparicio.com" class="ma-text-inherit">Insta-Idol</a>
              </div>
            </div>
          </figcaption>
        </figure>`;
    })
    .catch((err) => {
      container.innerHTML = 'Could not load photo.';
      console.error('[insta-idol-widget]', err);
    });
}());
</script>
